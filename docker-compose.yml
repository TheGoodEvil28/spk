version: '3.8'

services:
  mysql-spk:
    image: mysql:8.0
    container_name: spk_inventaris_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: spk_inventaris
      MYSQL_USER: spk_user
      MYSQL_PASSWORD: spk_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spk_network

  web:
    build: .
    container_name: spk_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql-spk
    environment:
      DB_HOST: mysql-spk
      DB_NAME: spk_inventaris
      DB_USER: spk_user
      DB_PASSWORD: spk_password
    networks:
      - spk_network

  adminer:
    image: adminer
    container_name: spk_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - spk_network
    depends_on:
      - mysql-spk

volumes:
  mysql_data:

networks:
  spk_network:
    driver: bridge